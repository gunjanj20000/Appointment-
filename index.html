<!doctype html>
<html lang="en" class="h-full bg-[#F0F2F5] dark:bg-[#0D1117] text-[#1C1C1E] dark:text-[#F3F4F6] antialiased selection:bg-[#007AFF] selection:text-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Appointment Buddy</title>
    <meta name="description" content="Mobile-first offline appointment organizer, queue management, and patient records with IndexedDB." />
    
    <!-- Instant Theme Initializer to prevent flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('appointment_buddy_theme');
          var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#007AFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Appointment Buddy" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Appointment Buddy" />
    <meta property="og:description" content="Mobile-first offline appointment organizer, queue management, and patient records with IndexedDB." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Outfit for elegant modern branding, Plus Jakarta Sans for clean readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full bg-[#F0F2F5] dark:bg-[#0D1117] font-sans text-[#1C1C1E] dark:text-[#F3F4F6] overflow-x-hidden">
    <div id="root" class="h-full min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
